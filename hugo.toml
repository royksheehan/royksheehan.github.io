baseURL = "https://royksheehan.github.io/"
languageCode = "pt-br"
title = "FII Direto"
enableRobotsTXT = true
summaryLength = 40

[pagination]
  pagerSize = 10

[taxonomies]
  tag    = "tags"
  ticker = "tickers"

[params]
  description = "Resumos e análises de relatórios gerenciais de Fundos Imobiliários"
  author = "FII Direto"
  keywords = "FII, fundos imobiliários, relatórios gerenciais, shoppings, logístico, lajes corporativas"
  siteUrl = "https://royksheehan.github.io"

[outputs]
